  { id: "001", word: "Are you all right?", meaning: "大丈夫ですか。", exA: "You don't look well. Are you all right?", exB: "Yes. I'm just sleepy.", exAJa: "具合がよくなさそうですね。大丈夫ですか。", exBJa: "はい。眠いだけです。", note: "" },

  { id: "003", word: "Can I take a message?", meaning: "ご伝言を承りましょうか。、何か伝えておきましょうか。", exA: "Hello. I'd like to speak to Sally, please.", exB: "I'm sorry, she's out now. Can I take a message?", exAJa: "もしもし。サリーをお願いします。", exBJa: "すみません、彼女は今外出しています。ご伝言を承りましょうか。", note: "電話での表現" },
  { id: "004", word: "Can you tell me where ...?", meaning: "どこに…か教えてもらえますか。", exA: "Excuse me. I'm looking for children's shoes. Can you tell me where they are?", exB: "They're on the third floor.", exAJa: "すみません。子ども用の靴を探しています。どこにあるか教えてもらえますか。", exBJa: "3階にあります。", note: "" },

  { id: "006", word: "Congratulations!", meaning: "おめでとう！", exA: "I won first prize in the singing contest!", exB: "Congratulations!", exAJa: "歌のコンテストで1等賞を取りました！", exBJa: "おめでとう！", note: "" },

  { id: "008", word: "Don't worry.", meaning: "心配しないで。", exA: "The final exam is tomorrow. I'm a little nervous.", exB: "Don't worry. You'll be all right.", exAJa: "最終試験は明日よ。少し緊張しているわ。", exBJa: "心配しないで。君なら大丈夫だよ。", note: "" },
  { id: "009", word: "Good luck.", meaning: "がんばって。", exA: "I'm going to play in a baseball game next week.", exB: "Are you? Good luck!", exAJa: "ぼくは来週、野球の試合に出るんだ。", exBJa: "そうなの？がんばって！", note: "" },
  { id: "010", word: "Guess what?", meaning: "（会話を切り出すときに）ねえねえ、聞いて。、ちょっと聞いてくれる？", exA: "Guess what? I'm going to France this summer!", exB: "That's great. Have fun.", exAJa: "ねえねえ、聞いて。今年の夏にフランスに行くの！", exBJa: "それはいいね。楽しんできてね。", note: "" },

  { id: "014", word: "Here it is.", meaning: "（物を差し出して）はい、どうぞ。", exA: "May I see your passport, please?", exB: "Sure. Here it is.", exAJa: "あなたのパスポートを見せていただけますか。", exBJa: "いいですよ。はい、どうぞ。", note: "Here you are[go]. とあわせて覚えよう" },

  { id: "016", word: "Here's 〜.", meaning: "（物を差し出して）〜をどうぞ。、こちらが〜になります。、ここに〜があります。", exA: "Here's your tea. Would you like some sugar or milk?", exB: "Just a little sugar, please.", exAJa: "紅茶をどうぞ。砂糖やミルクは入れますか。", exBJa: "砂糖を少しだけお願いします。", note: "" },
  { id: "017", word: "Hold on (, please).", meaning: "（電話で）切らずにお待ちください。", exA: "Can I speak to Mr. Taylor, please?", exB: "Sure. Hold on, please.", exAJa: "テイラーさんをお願いしたいのですが。", exBJa: "はい。切らずにお待ちください。", note: "" },
  { id: "018", word: "How [What] about 〜?", meaning: "〜はどうですか。", exA: "Can we go shopping together this weekend?", exB: "Sure. How about Sunday afternoon?", exAJa: "今週末、一緒に買い物に行きませんか。", exBJa: "いいですよ。日曜日の午後はどうですか。", note: "" },
  { id: "019", word: "How [What] about doing 〜?", meaning: "〜するのはどうですか。", exA: "How about going out for lunch?", exB: "Good idea. I'd like to try that new Italian restaurant.", exAJa: "昼食を外へ食べに行くのはどうですか。", exBJa: "いいですね。私はあの新しいイタリア料理店に行ってみたいです。", note: "" },
  { id: "020", word: "How about you?", meaning: "あなたはどうですか。", exA: "I'll have some orange juice. How about you?", exB: "I'll have coffee.", exAJa: "私はオレンジジュースにします。あなたはどうですか。", exBJa: "ぼくはコーヒーにします。", note: "" },

  { id: "022", word: "How is [was] 〜?", meaning: "〜（の様子）はどうですか[どうでしたか]。", exA: "How's your family?", exB: "They're fine, thank you.", exAJa: "ご家族はお元気ですか。", exBJa: "元気です、ありがとうございます。", note: "" },

  { id: "024", word: "I agree.", meaning: "そう思います。、同感[賛成]です。", exA: "This shirt will be a nice birthday present for Dad.", exB: "I agree. Let's get it for him.", exAJa: "このシャツはお父さんのいい誕生日プレゼントになるわ。", exBJa: "ぼくもそう思うよ。それをお父さんに買おう。", note: "" },
  { id: "025", word: "I can't decide.", meaning: "決められません。", exA: "You can have one of these books.", exB: "Well, I can't decide. They all look interesting.", exAJa: "これらの本の中から1冊あげます。", exBJa: "ええと、決められません。全部おもしろそうです。", note: "" },
  { id: "026", word: "I can't wait to do 〜.", meaning: "〜するのが待ちきれません。", exA: "You're going to the stadium this weekend, aren't you?", exB: "Yes. I can't wait to see the game.", exAJa: "あなたは今週末にスタジアムに行くんだよね？", exBJa: "うん。試合を見るのが待ちきれないよ。", note: "" },
  { id: "027", word: "I don't think so.", meaning: "私はそうは思いません。", exA: "Do you think it will rain today?", exB: "No, I don't think so.", exAJa: "君は今日は雨が降ると思いますか。", exBJa: "いいえ、私はそうは思いません。", note: "" },
  { id: "028", word: "I heard ...", meaning: "…だそうですね。、…と聞きました。", exA: "I heard you're going to join the art club.", exB: "Yes. I'm interested in painting.", exAJa: "君は美術部に入るんだそうね。", exBJa: "そうなの。絵を描くことに興味があるの。", note: "" },
  { id: "029", word: "I hope ...", meaning: "…だといいな。、…であることを望んでいます。", exA: "I want to be a pilot in the future.", exB: "I hope your dreams will come true.", exAJa: "ぼくは将来パイロットになりたいんだ。", exBJa: "あなたの夢が実現するといいわね。", note: "" },
  { id: "030", word: "I hope so.", meaning: "そうだといいな。、そう望みます。", exA: "I'm sure you'll pass the exam.", exB: "I hope so.", exAJa: "あなたはきっと試験に合格すると思うわ。", exBJa: "そうだといいな。", note: "" },

  { id: "032", word: "I think so, too.", meaning: "私もそう思います。", exA: "I think we should clean up the room first.", exB: "I think so, too.", exAJa: "まずは部屋を掃除したほうがいいと思うな。", exBJa: "私もそう思うわ。", note: "" },
  { id: "033", word: "I'd be glad [happy] to.", meaning: "喜んで。", exA: "Can you help me with my work tomorrow?", exB: "Sure, I'd be glad to.", exAJa: "明日、私の仕事を手伝ってもらえますか。", exBJa: "もちろんです、喜んで。", note: "" },

  { id: "035", word: "I'd love to.", meaning: "ぜひそうしたいです。", exA: "We're going to have a party tonight. Why don't you come?", exB: "I'd love to.", exAJa: "ぼくたちは今夜パーティーを開きます。あなたも来ませんか。", exBJa: "ぜひ行きたいです。", note: "" },
  { id: "036", word: "I'll be right back.", meaning: "すぐに戻ります。", exA: "Excuse me. Could I see the menu?", exB: "Of course, ma'am. I'll be right back.", exAJa: "すみません。メニューを見せてもらえますか。", exBJa: "もちろんです、お客さま。すぐに戻ります。", note: "" },
  { id: "037", word: "I'll be there (soon).", meaning: "（すぐに）そちらへ行きます。", exA: "John, I need your help. Can you come to the kitchen?", exB: "OK, Mom. I'll be there soon.", exAJa: "ジョン、手伝ってほしいの。台所に来られる？", exBJa: "わかったよ、お母さん。すぐにそっちへ行くよ。", note: "" },

  { id: "048", word: "Is anything wrong?", meaning: "どうかしましたか。、何か問題がありますか。", exA: "You're not eating the pizza. Is anything wrong?", exB: "Well, I don't like cheese very much.", exAJa: "ピザを食べていないじゃない。どうかしたの？", exBJa: "いやあ、ぼくはチーズがあまり好きじゃないんだ。", note: "" },

const SECTIONS = [
  { key: "all", label: "全部 (100個)", range: [1, 100] },
  { key: "s1", label: "前半 (001–050)", range: [1, 50] },
  { key: "s2", label: "後半 (051–100)", range: [51, 100] },
];

const STORAGE_KEY = "eiken3_phrase_progress_v1";
function loadProgress() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}

function App() {
  const [screen, setScreen] = useState("home");
  const [progress, setProgress] = useState(loadProgress);
  const [sectionKey, setSectionKey] = useState("all");
  const [quizResult, setQuizResultState] = useState(null);
  const [quizPool, setQuizPool] = useState([]);
  const [quizMode, setQuizMode] = useState("e2j");
  const [quizLen, setQuizLen] = useState(10);

  React.useEffect(() => {
    try { window.localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
  }, [progress]);

  const filteredWords = useMemo(() => {
    const sec = SECTIONS.find((s) => s.key === sectionKey);
    return WORDS.filter((w) => {
      const num = parseInt(w.id, 10);
      return num >= sec.range[0] && num <= sec.range[1];
    });
  }, [sectionKey]);

  const stats = useMemo(() => {
    let known = 0, learning = 0;
    WORDS.forEach((w) => {
      if (progress[w.id] === "known") known++;
      else if (progress[w.id] === "learning") learning++;
    });
    return { known, learning, total: WORDS.length };
  }, [progress]);

  const setWordStatus = (id, status) => setProgress((p) => ({ ...p, [id]: status }));

  return (
    <div style={styles.app}>
      <style>{globalCss}</style>
      <Header stats={stats} onHome={() => setScreen("home")} />
      <main style={styles.main}>
        {screen === "home" && (
          <Home stats={stats} onStudy={() => setScreen("study")} onQuiz={() => setScreen("quizSetup")}
            sectionKey={sectionKey} setSectionKey={setSectionKey} count={filteredWords.length}
            onReset={() => { if (confirm("学習の進み具合をすべてリセットします。よろしいですか？")) setProgress({}); }} />
        )}
        {screen === "study" && (
          <Study words={filteredWords} progress={progress} setWordStatus={setWordStatus} onBack={() => setScreen("home")} />
        )}
        {screen === "quizSetup" && (
          <QuizSetup count={filteredWords.length} quizMode={quizMode} setQuizMode={setQuizMode} quizLen={quizLen} setQuizLen={setQuizLen}
            onStart={() => { setQuizPool(buildQuiz(filteredWords, quizLen, quizMode)); setScreen("quiz"); }}
            onBack={() => setScreen("home")} />
        )}
        {screen === "quiz" && (
          <Quiz pool={quizPool} mode={quizMode} setWordStatus={setWordStatus}
            onFinish={(r) => { setQuizResultState(r); setScreen("quizResult"); }}
            onBack={() => setScreen("home")} />
        )}
        {screen === "quizResult" && (
          <QuizResult result={quizResult}
            onRetry={() => { setQuizPool(buildQuiz(filteredWords, quizLen, quizMode)); setScreen("quiz"); }}
            onReviewWrong={() => {
              const wrongIds = new Set(quizResult.wrong.map((w) => w.id));
              setQuizPool(buildQuiz(WORDS.filter((w) => wrongIds.has(w.id)), quizResult.wrong.length, quizMode));
              setScreen("quiz");
            }}
            onHome={() => setScreen("home")} />
        )}
      </main>
      <Footer />
    </div>
  );
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildQuiz(words, len, mode) {
  const picked = shuffle(words).slice(0, Math.min(len, words.length));
  return picked.map((w) => {
    const others = WORDS.filter((x) => x.id !== w.id);
    const distractors = shuffle(others).slice(0, 3);
    const options = shuffle([w, ...distractors]).map((o) => ({ id: o.id, label: mode === "e2j" ? o.meaning : o.word }));
    return { prompt: mode === "e2j" ? w.word : w.meaning, answerId: w.id, options, word: w };
  });
}

function Study({ words, progress, setWordStatus, onBack }) {
  const [i, setI] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [order] = useState(() => shuffle(words));
  const w = order[i];
  if (!w) return null;
  const status = progress[w.id];

  const go = (dir) => {
    setFlipped(false);
    setTimeout(() => {
      setI((v) => { const n = v + dir; if (n < 0) return 0; if (n >= order.length) return order.length - 1; return n; });
    }, 120);
  };
  const mark = (st) => { setWordStatus(w.id, st); if (i < order.length - 1) go(1); };
  const learnedCount = order.filter((x) => progress[x.id] === "known").length;

  return (
    <div className="fade-in">
      <TopBar onBack={onBack} title="覚えるカード" />
      <div style={styles.progRow}>
        <span style={styles.progText}>{i + 1} / {order.length}</span>
        <div style={styles.progBar}><div style={{ ...styles.progBarFill, width: ((i + 1) / order.length) * 100 + "%" }} /></div>
        <span style={styles.progText}>✓{learnedCount}</span>
      </div>
      <div style={styles.cardScene} onClick={() => setFlipped((f) => !f)}>
        <div style={{ ...styles.flipCard, transform: flipped ? "rotateY(180deg)" : "none" }}>
          <div style={styles.faceFront}>
            <span style={styles.posTag}>会話表現 {w.id}</span>
            <div style={styles.cardWord}>{w.word}</div>
            {status && <span style={status === "known" ? styles.badgeKnown : styles.badgeLearn}>{status === "known" ? "✓ おぼえた" : "学習中"}</span>}
            <div style={styles.tapHint}>タップで意味と会話例を見る 👆</div>
          </div>
          <div style={styles.faceBack}>
            <div style={styles.backMeaning}>{w.meaning}</div>
            <div style={styles.backEx}>
              <div style={styles.dialogRow}><span style={styles.spkA}>A</span><div><div style={styles.dialogEn}>{w.exA}</div><div style={styles.dialogJa}>{w.exAJa}</div></div></div>
              <div style={styles.dialogRow}><span style={styles.spkB}>B</span><div><div style={styles.dialogEn}>{w.exB}</div><div style={styles.dialogJa}>{w.exBJa}</div></div></div>
            </div>
            {w.note && <div style={styles.backNote}>💡 {w.note}</div>}
            <div style={styles.tapHint}>タップで英語にもどる 👆</div>
          </div>
        </div>
      </div>
      <div style={styles.studyBtnRow}>
        <button onClick={() => mark("learning")} style={styles.btnLearn}>🔁 もう一回</button>
        <button onClick={() => mark("known")} style={styles.btnKnown}>✓ おぼえた！</button>
      </div>
      <div style={styles.navRow}>
        <button onClick={() => go(-1)} style={styles.navBtn} disabled={i === 0}>← 前</button>
        <button onClick={() => go(1)} style={styles.navBtn} disabled={i === order.length - 1}>次 →</button>
      </div>
    </div>
  );
}

function Quiz({ pool, mode, setWordStatus, onFinish, onBack }) {
  const [i, setI] = useState(0);
  const [picked, setPicked] = useState(null);
  const [correctCount, setCorrectCount] = useState(0);
  const [wrong, setWrong] = useState([]);
  const q = pool[i];
  if (!q) return null;

  const choose = (optId) => {
    if (picked) return;
    setPicked(optId);
    if (optId === q.answerId) { setCorrectCount((c) => c + 1); setWordStatus(q.word.id, "known"); }
    else { setWrong((arr) => [...arr, q.word]); setWordStatus(q.word.id, "learning"); }
  };
  const advance = () => {
    if (i < pool.length - 1) { setI(i + 1); setPicked(null); }
    else { onFinish({ total: pool.length, correct: correctCount, wrong }); }
  };

  return (
    <div className="fade-in">
      <TopBar onBack={onBack} title={`テスト ${i + 1}/${pool.length}`} />
      <div style={styles.progRow}>
        <div style={styles.progBar}><div style={{ ...styles.progBarFill, width: (i / pool.length) * 100 + "%", background: "#1f7d76" }} /></div>
        <span style={{ ...styles.progText, color: "#1f7d76" }}>✓{correctCount}</span>
      </div>
      <div style={styles.quizPrompt}>
        <div style={styles.quizPromptSub}>会話表現</div>
        <div style={styles.quizPromptMain}>{q.prompt}</div>
        <div style={styles.quizQ}>{mode === "e2j" ? "意味は？" : "英語は？"}</div>
      </div>
      <div style={styles.optGrid}>
        {q.options.map((o) => {
          let st = styles.optBtn;
          if (picked) {
            if (o.id === q.answerId) st = styles.optCorrect;
            else if (o.id === picked) st = styles.optWrong;
            else st = styles.optDim;
          }
          return (
            <button key={o.id} onClick={() => choose(o.id)} style={st} disabled={!!picked}>
              {o.label}
              {picked && o.id === q.answerId && <span style={styles.optIcon}>✓</span>}
              {picked && o.id === picked && o.id !== q.answerId && <span style={styles.optIcon}>✕</span>}
            </button>
          );
        })}
      </div>
      {picked && (
        <div className="fade-in" style={styles.quizFeedback}>
          <div style={picked === q.answerId ? styles.fbCorrect : styles.fbWrong}>{picked === q.answerId ? "せいかい！🎉" : "おしい！もう一度かくにん 👇"}</div>
          <div style={styles.fbCard}>
            <b style={{ fontSize: 17 }}>{q.word.word}</b>
            <div style={{ marginTop: 4 }}>{q.word.meaning}</div>
            <div style={{ marginTop: 8, color: "#555", fontSize: 14 }}>
              <div><b style={{ color: "#e85d2f" }}>A:</b> {q.word.exA}</div>
              <div><b style={{ color: "#1f7d76" }}>B:</b> {q.word.exB}</div>
            </div>
          </div>
          <button onClick={advance} style={styles.nextBig}>{i < pool.length - 1 ? "次の問題へ →" : "結果を見る 🏁"}</button>
        </div>
      )}
    </div>
  );
}

function QuizResult({ result, onRetry, onReviewWrong, onHome }) {
  if (!result) return null;
  const { total, correct, wrong } = result;
  const pct = Math.round((correct / total) * 100);
  let msg = "もう少し！くり返せば必ず覚えられるよ 💪", emoji = "🌱";
  if (pct === 100) { msg = "パーフェクト！すごい！🏆"; emoji = "🏆"; }
  else if (pct >= 80) { msg = "よくできました！この調子！⭐"; emoji = "🌟"; }
  else if (pct >= 60) { msg = "いい感じ！あと一歩！👍"; emoji = "😊"; }

  return (
    <div className="fade-in">
      <section style={{ ...styles.card, textAlign: "center", paddingTop: 36 }}>
        <div style={{ fontSize: 56 }}>{emoji}</div>
        <div style={styles.resultScore}>{correct} <span style={{ fontSize: 26, color: "#bbb" }}>/ {total}</span></div>
        <div style={styles.resultPct}>正答率 {pct}%</div>
        <div style={styles.resultMsg}>{msg}</div>
      </section>
      {wrong.length > 0 && (
        <section style={styles.card}>
          <h2 style={styles.cardTitle}>🔁 まちがえた表現（{wrong.length}）</h2>
          {wrong.map((w) => (
            <div key={w.id} style={styles.wrongRow}>
              <div>
                <b style={{ fontSize: 15 }}>{w.word}</b>
                <div style={{ fontSize: 14, color: "#555" }}>{w.meaning}</div>
              </div>
            </div>
          ))}
        </section>
      )}
      <div style={styles.actionGrid}>
        {wrong.length > 0 && (
          <button onClick={onReviewWrong} style={{ ...styles.startBtn, background: "linear-gradient(135deg,#ff8a5c,#e85d2f)", margin: 0 }}>まちがえた{wrong.length}問だけ再挑戦</button>
        )}
        <button onClick={onRetry} style={{ ...styles.startBtn, margin: 0 }}>もう一度テスト</button>
      </div>
      <button onClick={onHome} style={styles.resetBtn}>ホームにもどる</button>
    </div>
  );
}

function TopBar({ onBack, title }) {
  return (
    <div style={styles.topBar}>
      <button onClick={onBack} style={styles.backBtn}>←</button>
      <span style={styles.topTitle}>{title}</span>
      <span style={{ width: 40 }} />
    </div>
  );
}

function Footer() {
  return <footer style={styles.footer}>『英検3級 単語帳 会話表現編』より・学習用アプリ</footer>;
}
